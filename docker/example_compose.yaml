# ========================================================================
# For the case where we want to include camera name in the node namespace
# ========================================================================

services:
  realsense:
    image: ctumrs/bluefox2:unstable
    #build: .
    privileged: true
    network_mode: "host"
    configs:
      - source: cfg_yaml
        target: /custom_config.yaml
        mode: 0444  # read-only permissions
    command: custom_config:=/custom_config.yaml
    environment:
      - UAV_NAME=uav1

configs:
  cfg_yaml:
    content: |
      /uav1/mv_26808027/bluefox2_single:
        ros__parameters:
          fps: 25
          remappings:
            '/uav1/mv_26808027/image_raw': /abc

# ========================================================================
# This is the case when we do not need camera name in the namespace,
# because we only have one camera on the drone. Definning parameters
# is easier then, because we do ot have to look up the serial number
# of the camera.
# ========================================================================

services:
  realsense:
    image: ctumrs/bluefox2:unstable
    #build: .
    privileged: true
    network_mode: "host"
    configs:
      - source: cfg_yaml
        target: /custom_config.yaml
        mode: 0444  # read-only permissions
    command: custom_config:=/custom_config.yaml
    environment:
      - UAV_NAME=uav1
      - USE_CAMERA_NAME=false

configs:
  cfg_yaml:
    content: |
      /uav1/bluefox2_single:
        ros__parameters:
          fps: 25
          remappings:
            '/uav1/image_raw': /abc


# ========================================================================
# You can also add calibration values of the camera inline.
# ========================================================================

services:
  realsense:
    image: ctumrs/bluefox2:unstable
    #build: .
    privileged: true
    network_mode: "host"
    configs:
      - source: cfg_yaml
        target: /custom_config.yaml
        mode: 0444  # read-only permissions
      - source: calibration
        target: /camera_calibration.yaml
        mode: 0444  # read-only permissions
    command: custom_config:=/custom_config.yaml
    environment:
      - UAV_NAME=uav1
      - USE_CAMERA_NAME=false

configs:

  cfg_yaml:
    content: |
      /uav1/bluefox2_single:
        ros__parameters:
          fps: 25
          remappings:
            '/uav1/image_raw': /abc
          calib_url: /camera_calibration.yaml

  calibration:
    content: |
      image_width: 752
      image_height: 480
      camera_name: mv_26808027
      camera_matrix:
        rows: 3
        cols: 3
        data: [609.952391, 0.000000, 380.176995, 0.000000, 610.025106, 222.719530, 0.000000, 0.000000, 1.000000]
      distortion_model: plumb_bob
      distortion_coefficients:
        rows: 1
        cols: 5
        data: [-2.615388e+02, 0.000000e+00, 9.672868e-04, 4.034114e-06, -1.480877e-08, 2.407404e-11 ]
      rectification_matrix:
        rows: 3
        cols: 3
        data: [1.000000, 0.000000, 0.000000, 0.000000, 1.000000, 0.000000, 0.000000, 0.000000, 1.000000]
      projection_matrix:
        rows: 3
        cols: 4
        data: [505.167053, 0.000000, 380.176995, 0.000000, 0.000000, 568.042664, 222.719530, 0.000000, 0.000000, 0.000000, 1.000000, 0.000000]